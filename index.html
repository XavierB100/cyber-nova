<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>POLARIS // Dual-Polarity Tactical Interceptor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;900&family=JetBrains+Mono:wght@600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    :root {
      --bg: #06070a;
      --solar: #f59e0b;
      --solar-glow: rgba(245, 158, 11, 0.4);
      --void: #38bdf8;
      --void-glow: rgba(56, 189, 248, 0.4);
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: #f8fafc;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Minimalist HUD */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .score-txt {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      line-height: 1;
    }
    .chain-txt {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1px;
    }

    .graze-gauge-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .graze-lbl {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #64748b;
      font-weight: 700;
    }
    .graze-bar-bg {
      width: 80px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .graze-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
      transition: width 0.1s linear;
    }

    /* Polarity Indicator on Bottom */
    .polarity-hud {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }
    .polarity-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      transition: all 0.2s ease;
    }
    .polarity-badge.solar {
      color: var(--solar);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
    }
    .polarity-badge.void {
      color: var(--void);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }
    .polarity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .polarity-badge.solar .polarity-dot { background: var(--solar); box-shadow: 0 0 8px var(--solar); }
    .polarity-badge.void .polarity-dot { background: var(--void); box-shadow: 0 0 8px var(--void); }

    /* Minimal Tap-to-Shift cue */
    .shift-cue {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 8px;
    }

    /* Start / Overlays - Clean, Zero Bloat */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 10, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
    }
    .screen-overlay.hidden {
      display: none;
    }
    .game-logo {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #ffffff;
      margin-bottom: 4px;
      line-height: 1;
    }
    .game-byline {
      font-size: 11px;
      letter-spacing: 3px;
      color: #64748b;
      margin-bottom: 36px;
      text-transform: uppercase;
    }
    .core-mechanic-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 32px;
      font-size: 11px;
      color: #94a3b8;
    }
    .core-mechanic-pill span.solar { color: var(--solar); font-weight: 800; }
    .core-mechanic-pill span.void { color: var(--void); font-weight: 800; }

    .btn-launch {
      width: 220px;
      height: 52px;
      border-radius: 12px;
      background: #ffffff;
      color: #06070a;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
      transition: transform 0.15s, background 0.15s;
    }
    .btn-launch:active {
      transform: scale(0.96);
      background: #e2e8f0;
    }

    /* Minimal Game Over */
    .gameover-stat {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #ffffff;
      margin: 12px 0 4px 0;
      font-family: var(--font-display);
    }
    .gameover-label {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .meta-row {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
    .meta-row b {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Sleek Top HUD -->
    <div class="hud">
      <div class="hud-left">
        <div id="scoreDisplay" class="score-txt">0</div>
        <div id="chainDisplay" class="chain-txt">ABSORB x1</div>
      </div>
      <div class="graze-gauge-wrap">
        <span class="graze-lbl">OVERDRIVE</span>
        <div class="graze-bar-bg">
          <div id="overdriveBar" class="graze-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Polarity State Footer -->
    <div class="polarity-hud">
      <div id="polarityBadge" class="polarity-badge void">
        <span class="polarity-dot"></span>
        <span id="polarityLabel">VOID SHIELD</span>
      </div>
      <div class="shift-cue">DOUBLE TAP TO POLARIZE</div>
    </div>

    <!-- Clean Start Screen (No Bloat Text) -->
    <div id="startScreen" class="screen-overlay">
      <div class="game-logo">POLARIS</div>
      <div class="game-byline">IKARUGA DUAL-POLARITY PROTOCOL</div>

      <div class="core-mechanic-pill">
        <span class="void">VOID</span> absorbs <span class="void">BLUE</span>
        &bull;
        <span class="solar">SOLAR</span> absorbs <span class="solar">ORANGE</span>
      </div>

      <button id="startBtn" class="btn-launch">
        ENGAGE
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Minimal Game Over Screen -->
    <div id="gameOverScreen" class="screen-overlay hidden">
      <div class="game-byline" style="color: #f43f5e; margin-bottom: 0;">TERMINATED</div>
      <div id="finalScore" class="gameover-stat">0</div>
      <div class="gameover-label">FINAL SCORE</div>

      <div class="meta-row">
        <span>BEST <b id="finalHighScore">0</b></span>
        <span>ABSORBED <b id="finalAbsorbs">0</b></span>
        <span>PEAK CHAIN <b id="finalChain">x1</b></span>
      </div>

      <button id="restartBtn" class="btn-launch">RETRY</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       TACTICAL PROCEDURAL SYNTHESIZER
       Harmonic chord shifts upon polarity switch, crisp absorption sounds
       ========================================================================== */
    class PolarisAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.master = null;
      }
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.28;
        this.master.connect(this.ctx.destination);
      }
      playLaser(polarity) {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(polarity === 'void' ? 580 : 380, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.075);
      }
      playAbsorb(polarity) {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const base = polarity === 'void' ? 659.25 : 440;
        osc.frequency.setValueAtTime(base, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(base * 1.5, this.ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playShift(toPolarity) {
        if (!this.ctx || this.muted) return;
        const chord = toPolarity === 'void' ? [523.25, 659.25, 783.99] : [349.23, 440, 523.25];
        chord.forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(this.master);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.19);
        });
      }
      playOverdrive() {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.65);
      }
      playKill() {
        if (!this.ctx || this.muted) return;
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.25);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.25);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        noise.start();
      }
    }

    const audio = new PolarisAudio();

    /* ==========================================================================
       CANVAS & GAMEPLAY LOOP
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    let highScore = parseInt(localStorage.getItem('polaris_best') || '0', 10);

    // Game variables
    let state = 'start';
    let score = 0;
    let chain = 1;
    let maxChain = 1;
    let totalAbsorbed = 0;
    let overdrive = 0;
    let gameTime = 0;
    let lastPlayerFire = 0;
    let screenShake = 0;

    // Player Craft (Ikaruga dual polarity)
    const player = {
      x: width / 2,
      y: height - 140,
      targetX: width / 2,
      targetY: height - 140,
      radius: 15,
      polarity: 'void', // 'void' (blue) or 'solar' (orange)
      invuln: 0
    };

    // Entities
    let stars = [];
    let playerBullets = [];
    let enemyBullets = []; // Polarized bullets: void or solar
    let enemies = []; // Polarized craft: void or solar
    let particles = [];
    let absorbRings = [];

    // Background Stars
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        speed: Math.random() * 1.8 + 0.5,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.7 + 0.2
      });
    }

    // Touch Controls: Drag anywhere to fly, double-tap to switch polarity
    let isTouching = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let playerStartX = 0;
    let playerStartY = 0;
    let lastTapTime = 0;

    window.addEventListener('touchstart', (e) => {
      audio.init();
      if (state !== 'playing') return;
      const t = e.touches[0];
      const now = performance.now();

      // Double tap detector (within 280ms)
      if (now - lastTapTime < 280) {
        togglePolarity();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }

      isTouching = true;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      playerStartX = player.x;
      playerStartY = player.y;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (state !== 'playing' || !isTouching) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      player.targetX = Math.max(20, Math.min(width - 20, playerStartX + dx));
      player.targetY = Math.max(60, Math.min(height - 40, playerStartY + dy));
    }, { passive: false });

    window.addEventListener('touchend', () => { isTouching = false; });

    // Desktop testing support
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.screen-overlay')) return;
      audio.init();
      if (state !== 'playing') return;
      const now = performance.now();
      if (now - lastTapTime < 280) {
        togglePolarity();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
      player.targetX = e.clientX;
      player.targetY = e.clientY;
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'KeyX') {
        togglePolarity();
      }
    });

    function togglePolarity() {
      if (state !== 'playing') return;
      player.polarity = player.polarity === 'void' ? 'solar' : 'void';
      audio.playShift(player.polarity);
      if ('vibrate' in navigator) navigator.vibrate([25]);

      // Shift flash particles
      for (let i = 0; i < 18; i++) {
        const ang = (Math.PI * 2 / 18) * i;
        particles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(ang) * 9,
          vy: Math.sin(ang) * 9,
          radius: 2.5,
          color: player.polarity === 'void' ? '#38bdf8' : '#f59e0b',
          life: 0.3,
          maxLife: 0.3
        });
      }

      const badge = document.getElementById('polarityBadge');
      const label = document.getElementById('polarityLabel');
      if (player.polarity === 'void') {
        badge.className = 'polarity-badge void';
        label.innerText = 'VOID SHIELD';
      } else {
        badge.className = 'polarity-badge solar';
        label.innerText = 'SOLAR SHIELD';
      }
    }

    // UI Listeners
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    function startGame() {
      audio.init();
      state = 'playing';
      score = 0;
      chain = 1;
      maxChain = 1;
      totalAbsorbed = 0;
      overdrive = 0;
      gameTime = 0;
      lastPlayerFire = 0;
      screenShake = 0;

      player.x = width / 2;
      player.y = height - 140;
      player.targetX = player.x;
      player.targetY = player.y;
      player.polarity = 'void';
      player.invuln = 1.5;

      playerBullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];
      absorbRings = [];

      document.getElementById('polarityBadge').className = 'polarity-badge void';
      document.getElementById('polarityLabel').innerText = 'VOID SHIELD';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = score.toLocaleString();
      document.getElementById('chainDisplay').innerText = `ABSORB x${chain.toFixed(1)}`;
      document.getElementById('overdriveBar').style.width = `${Math.min(100, overdrive)}%`;
    }

    function releaseOverdrive() {
      overdrive = 0;
      screenShake = 18;
      audio.playOverdrive();
      if ('vibrate' in navigator) navigator.vibrate([100, 50, 150]);

      // Massive homing burst that vaporizes opposite polarity hostiles
      enemies.forEach(e => {
        score += e.baseScore * chain * 2;
        spawnExplosion(e.x, e.y, e.polarity === 'void' ? '#38bdf8' : '#f59e0b', 24);
      });
      enemies = [];

      // Clear all bullets
      enemyBullets = [];

      // Expanding dual nova ring
      for (let i = 0; i < 40; i++) {
        const ang = (Math.PI * 2 / 40) * i;
        particles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(ang) * 14,
          vy: Math.sin(ang) * 14,
          radius: 3,
          color: i % 2 === 0 ? '#38bdf8' : '#f59e0b',
          life: 0.55,
          maxLife: 0.55
        });
      }
      updateHUD();
    }

    function spawnExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 8 + 2;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          radius: Math.random() * 3 + 1,
          color,
          life: 0.45,
          maxLife: 0.45
        });
      }
    }

    function gameOver() {
      state = 'gameover';
      audio.playKill();
      if ('vibrate' in navigator) navigator.vibrate([200, 100, 300]);
      screenShake = 22;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('polaris_best', highScore.toString());
      }

      document.getElementById('finalScore').innerText = score.toLocaleString();
      document.getElementById('finalHighScore').innerText = highScore.toLocaleString();
      document.getElementById('finalAbsorbs').innerText = totalAbsorbed.toLocaleString();
      document.getElementById('finalChain').innerText = `x${maxChain.toFixed(1)}`;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    /* ==========================================================================
       TICK LOOP
       ========================================================================== */
    let lastTime = performance.now();

    function loop(now) {
      requestAnimationFrame(loop);
      let dt = (now - lastTime) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastTime = now;

      // Stars
      stars.forEach(s => {
        s.y += s.speed * (state === 'playing' ? 2.5 : 0.8);
        if (s.y > height) {
          s.y = 0;
          s.x = Math.random() * width;
        }
      });

      if (state === 'playing') {
        gameTime += dt;

        // Player movement interpolation
        player.x += (player.targetX - player.x) * 0.28;
        player.y += (player.targetY - player.y) * 0.28;

        if (player.invuln > 0) player.invuln -= dt;

        // Auto cannon
        if (gameTime - lastPlayerFire > 0.11) {
          lastPlayerFire = gameTime;
          audio.playLaser(player.polarity);

          [-8, 8].forEach(offX => {
            playerBullets.push({
              x: player.x + offX,
              y: player.y - 16,
              vx: 0,
              vy: -20,
              polarity: player.polarity
            });
          });
        }

        // Bullet Hell Spawning - Rapid, Dense, Polarized Patterns
        // Difficulty ramps up fast: multiple enemies per wave, complex bullet curtains
        const spawnCadence = Math.max(0.35, 1.3 - (gameTime * 0.015));
        if (Math.random() < dt / spawnCadence) {
          const p = Math.random() < 0.5 ? 'void' : 'solar';
          const types = [
            { type: 'scout', hp: 2, radius: 14, score: 200, vy: 3.2 },
            { type: 'frigate', hp: 7, radius: 22, score: 500, vy: 1.8 }
          ];
          const choice = types[Math.random() < 0.75 ? 0 : 1];
          enemies.push({
            type: choice.type,
            polarity: p,
            x: Math.random() * (width - 60) + 30,
            y: -30,
            vx: (Math.random() - 0.5) * 2,
            vy: choice.vy,
            hp: choice.hp,
            radius: choice.radius,
            baseScore: choice.score,
            lastFire: gameTime + Math.random() * 0.3,
            fireRate: choice.type === 'scout' ? 1.2 : 0.7,
            bulletPattern: choice.type === 'scout' ? 'aimed' : 'spiral',
            spiralAng: 0
          });
        }

        // Update Player Bullets
        for (let i = playerBullets.length - 1; i >= 0; i--) {
          const b = playerBullets[i];
          b.y += b.vy;
          if (b.y < -30) playerBullets.splice(i, 1);
        }

        // Update Enemies & Attack Patterns
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.x += e.vx;
          e.y += e.vy;

          if (e.x < e.radius || e.x > width - e.radius) e.vx *= -1;

          // Enemy bullet storm generation
          if (gameTime - e.lastFire > e.fireRate && e.y > 30 && e.y < height - 100) {
            e.lastFire = gameTime;

            if (e.bulletPattern === 'aimed') {
              // 3-way aimed fan
              const baseAng = Math.atan2(player.y - e.y, player.x - e.x);
              [-0.2, 0, 0.2].forEach(offset => {
                enemyBullets.push({
                  x: e.x,
                  y: e.y + e.radius,
                  vx: Math.cos(baseAng + offset) * 4.6,
                  vy: Math.sin(baseAng + offset) * 4.6,
                  polarity: e.polarity,
                  radius: 5
                });
              });
            } else {
              // Dense spiral curtain
              e.spiralAng += 0.6;
              for (let k = 0; k < 4; k++) {
                const ang = e.spiralAng + (Math.PI / 2) * k;
                enemyBullets.push({
                  x: e.x,
                  y: e.y + e.radius,
                  vx: Math.cos(ang) * 4.0,
                  vy: Math.sin(ang) * 4.0,
                  polarity: e.polarity,
                  radius: 5
                });
              }
            }
          }

          // Player Bullet hitting enemy
          for (let j = playerBullets.length - 1; j >= 0; j--) {
            const pb = playerBullets[j];
            const dist = Math.hypot(e.x - pb.x, e.y - pb.y);
            if (dist < e.radius + 8) {
              playerBullets.splice(j, 1);

              // Ikaruga rule: Opposite polarity deals 2x damage!
              const damage = pb.polarity !== e.polarity ? 2 : 1;
              e.hp -= damage;

              if (e.hp <= 0) {
                audio.playKill();
                screenShake = 6;
                spawnExplosion(e.x, e.y, e.polarity === 'void' ? '#38bdf8' : '#f59e0b', 18);

                // Opposite kills award 2x score bonus
                const scoreMult = pb.polarity !== e.polarity ? 2 : 1;
                score += Math.floor(e.baseScore * chain * scoreMult);
                enemies.splice(i, 1);
                updateHUD();
                break;
              }
            }
          }

          // Enemy body collision
          if (enemies[i]) {
            const shipDist = Math.hypot(e.x - player.x, e.y - player.y);
            if (shipDist < e.radius + player.radius && player.invuln <= 0) {
              gameOver();
              return;
            } else if (e.y > height + 50) {
              enemies.splice(i, 1);
            }
          }
        }

        // Update Enemy Bullets & POLARITY ABSORPTION MECHANIC
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const eb = enemyBullets[i];
          eb.x += eb.vx;
          eb.y += eb.vy;

          const dist = Math.hypot(eb.x - player.x, eb.y - player.y);

          // Absorption Zone (Graze & absorb identical polarity)
          if (dist < player.radius + eb.radius + 4) {
            if (eb.polarity === player.polarity) {
              // ABSORPTION SUCCESS!
              audio.playAbsorb(player.polarity);
              enemyBullets.splice(i, 1);

              totalAbsorbed++;
              score += Math.floor(50 * chain);
              chain = Math.min(8.0, chain + 0.1);
              if (chain > maxChain) maxChain = chain;

              overdrive += 3.5;
              if (overdrive >= 100) {
                releaseOverdrive();
              }

              // Absorption ripple
              absorbRings.push({
                x: player.x,
                y: player.y,
                radius: 12,
                color: player.polarity === 'void' ? '#38bdf8' : '#f59e0b',
                alpha: 1.0
              });

              updateHUD();
              continue;
            } else {
              // WRONG POLARITY = INSTANT DEATH!
              if (player.invuln <= 0) {
                gameOver();
                return;
              }
            }
          }

          if (eb.y > height + 30 || eb.x < -30 || eb.x > width + 30 || eb.y < -30) {
            enemyBullets.splice(i, 1);
          }
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Absorb Rings
      for (let i = absorbRings.length - 1; i >= 0; i--) {
        const r = absorbRings[i];
        r.radius += 2.5;
        r.alpha -= dt * 4;
        if (r.alpha <= 0) absorbRings.splice(i, 1);
      }

      /* ==========================================================================
         RENDER
         ========================================================================== */
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.85;
        if (screenShake < 0.4) screenShake = 0;
      }

      // Space Clear
      ctx.fillStyle = '#06070a';
      ctx.fillRect(0, 0, width, height);

      // Stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Absorb Rings
      absorbRings.forEach(r => {
        ctx.strokeStyle = r.color;
        ctx.globalAlpha = Math.max(0, r.alpha);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.globalAlpha = 1.0;

      // Player Bullets
      playerBullets.forEach(b => {
        const col = b.polarity === 'void' ? '#38bdf8' : '#f59e0b';
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, 2.5, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, 1.2, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemy Polarized Bullets: Distinct solid orbs with inner white core
      enemyBullets.forEach(eb => {
        const col = eb.polarity === 'void' ? '#38bdf8' : '#f59e0b';
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemies
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        const col = e.polarity === 'void' ? '#38bdf8' : '#f59e0b';

        ctx.fillStyle = '#111827';
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;

        if (e.type === 'scout') {
          // Sharp angular wedge
          ctx.beginPath();
          ctx.moveTo(0, e.radius);
          ctx.lineTo(-e.radius * 0.8, -e.radius * 0.7);
          ctx.lineTo(0, -e.radius * 0.2);
          ctx.lineTo(e.radius * 0.8, -e.radius * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else {
          // Diamond Cruiser
          ctx.beginPath();
          ctx.moveTo(0, e.radius * 1.1);
          ctx.lineTo(-e.radius, 0);
          ctx.lineTo(0, -e.radius * 1.1);
          ctx.lineTo(e.radius, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // Polarized core eye
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // Player Craft
      if (state === 'playing') {
        const flicker = player.invuln > 0 && Math.floor(gameTime * 24) % 2 === 0;
        if (!flicker) {
          ctx.save();
          ctx.translate(player.x, player.y);
          const col = player.polarity === 'void' ? '#38bdf8' : '#f59e0b';

          // Polarity shield aura
          ctx.strokeStyle = col;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, player.radius + 6, 0, Math.PI * 2);
          ctx.stroke();

          // Interceptor Chassis
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = col;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -player.radius * 1.3);
          ctx.lineTo(-player.radius * 0.75, player.radius * 0.8);
          ctx.lineTo(0, player.radius * 0.4);
          ctx.lineTo(player.radius * 0.75, player.radius * 0.8);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Core
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, -player.radius * 0.1, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      ctx.restore();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
